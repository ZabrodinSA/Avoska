<h1>Goods</h1>

@if (goods$ | async; as goods) {
  @for (good of goods; track good.id) {
    <app-good-card [good]="good" />
  }
}

<h2>Категории</h2>

@if (categories$ | async; as categories) {

  @for (category of categories; track category.id) {

    <button>
      {{ category.name }}
    </button>

  }

}
